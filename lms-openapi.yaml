  /employees/{employeeId}:
    parameters:
      - name: employeeId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Employees]
      summary: Get a single employee record
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Employees]
      summary: Update an employee record (role, department, manager, employment status, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Employees]
      summary: Deactivate an employee
      description: |
        Sets `employment_status = SEPARATED` rather than deleting the row, since
        `app_users` is referenced by historical leave/approval/audit records
        under `ON DELETE RESTRICT` (DB design §05).
      responses:
        '204':
          description: Deactivated.
        '403': { $ref: '#/components/responses/Forbidden' }

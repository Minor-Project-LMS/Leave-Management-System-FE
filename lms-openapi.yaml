      description: "x-assumption: true — inferred from HR-01's Quick Actions list."
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId, fiscalYear, quota]
              properties:
                categoryId: { type: integer }
                fiscalYear: { type: integer }
                quota: { type: number, format: float }
      responses:
        '200':
          description: Ledger opening/quota adjusted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveLedgerSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /employees/import:
    post:
      tags: [Employees]
      summary: Bulk-import employees (HR-01 "Import Employees")
      description: |
        x-assumption: true — inferred from HR-01's Quick Actions.
        Maximum file size: **10 MB**, enforced on both the client and the
        server (`400 FILE_TOO_LARGE` if exceeded).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "CSV/XLSX of employees. Max size: 10 MB (10,485,760 bytes)."
      responses:
        '200':
          description: Import summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  skipped: { type: integer }
                  errors:
                    type: array
                    items: { type: string }
        '400':
          description: Validation error, malformed file, or file exceeds the 10 MB limit (`FILE_TOO_LARGE`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /employees/export:
    get:

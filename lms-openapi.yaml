openapi: 3.1.0

info:
  title: Leave Management System (LMS) API
  version: 1.0.0
  description: |
    Backend REST API contract for the Leave Management System, derived from the
    System Design (HLD), Database Design, BRD, and UI/UX Design documents, and
    cross-checked against the existing frontend source (`src/services/api.js`,
    `src/api/axios.js`, `src/context/AuthProvider.jsx`) so that already-built
    screens (Login, Forgot/Reset Password, Dashboard) work against this contract
    unchanged.

    ## Decisions confirmed with the team

    1. **Versioning — RESOLVED.** Every path in this spec is mounted under
       `/api/v1` (see `servers` below), matching the HLD's API Design
       Conventions. The frontend's `VITE_API_BASE_URL` is being updated from
       `/api` to `/api/v1` to match; existing calls (`/auth/login`, `/users/me`,
       `/dashboard/summary`, `/leave-requests`, `/holidays/upcoming`,
       `/audit-log/recent`, etc.) are unchanged apart from that prefix.
    2. **Auth model — confirmed.** The frontend's refresh-token-in-httpOnly-cookie
       + short-lived access-token-in-memory model (not the simpler "JWT on every
       request, no refresh" description in the HLD) is the confirmed contract.
       `POST /auth/login` and `POST /auth/refresh` set a `Set-Cookie` refresh
       token and return `accessToken` + `user` in the JSON body, matching
       `AuthProvider.jsx`.
    3. **Screen-inferred endpoints — reviewed and accepted.** Endpoints
       reverse-engineered from a specific UI/UX screen element rather than named
       explicitly in the HLD/DB docs (e.g. "Retry Failed" on HR-07 implying
       `POST /notification-queue/retry-failed`) have been reviewed and accepted
       as required functionality. They remain marked `x-assumption: true` in
       their description purely so backend engineers can see at a glance which
       endpoints have no line item in the HLD/DB docs to cross-reference against
       — not as an open question.
    4. **File attachment size limit — RESOLVED: 10 MB.** All multipart file
       uploads (leave-request attachments, profile photo, holiday import,
       employee import) enforce a **10 MB maximum**, on both the frontend
       (client-side check before upload) and the backend (hard limit, returns
       `400` with code `FILE_TOO_LARGE` if exceeded). This closes the open
       question in UI/UX §10.3.
    5. **Self-registration — gated by a system setting, off by default.**
       `POST /auth/register` is only usable when HR enables
       `settings.systemPreferences.employeeSelfRegistration` (HR-08). While
       disabled — the default — the endpoint returns `403` with the exact
       user-facing message **"Contact HR to get enabled."**
    6. Two-tier approval, delegation resolution, comp-off ledger crediting, and
       audit-log writes are described as **side effects** of the relevant
       endpoints (per the HLD workflow and DB business rules) rather than as
       separate client-callable endpoints, since the design doc states these are
       enforced server-side in the service layer.
    7. **Reconciled against a newer FE snapshot.** The Manager Dashboard has
       since been implemented and calls six concrete endpoints under a separate
       `/manager/...` namespace (`/manager/dashboard/summary`,
       `/manager/dashboard/leave-trend`, `/manager/dashboard/leave-distribution`,
       `/manager/approvals/pending`, `/manager/team/leave-overview`,
       `/manager/team/upcoming-leaves`) — replacing this spec's earlier, guessed
       `/dashboard/manager-summary` single endpoint. Response shapes below are
       taken directly from that build's `mockManagerSummary` /
       `mockPendingApprovals` / `mockTeamLeaveOverview` /
       `mockUpcomingTeamLeaves` fixtures, which the frontend documents as
       "mirroring the shape of the real API responses." `/dashboard/hr-summary`
       has no equivalent HR Dashboard implementation yet in the FE to confirm
       against, so it remains an `x-assumption: true` placeholder.
    8. **Notification delivery — now event-driven via Kafka.** The scheduled
       polling worker described in the HLD is replaced by a Kafka-based
       pipeline: state-changing actions (decisions, delegation, comp-off
       credit) write a domain event to a transactional outbox in the same
       DB transaction as the business change, a publisher relays it onto the
       `lms.notifications.v1` topic, and a consumer group fans it out into
       per-recipient/per-channel rows for delivery. This is an internal
       architecture change only — the client-facing contract
       (`GET /notifications`, `GET /notification-queue`, etc.) is unchanged;
       `NotificationQueueItem` gains read-only `sourceEventId` /
       `kafkaTopic` / `kafkaPartition` / `kafkaOffset` fields purely for
       HR-06/HR-07 traceability and replay/debugging.
    9. **File uploads — now backed by blob storage (S3/Azure Blob/GCS).**
       Every upload endpoint (leave-request attachments, avatar, holiday
       import, employee import) still accepts the file the same way from
       the client (`multipart/form-data`), but the API now streams it
       straight into a blob-storage bucket instead of local disk and
       persists only the resulting object metadata and a UI-fetchable link
       — never the bytes — in Postgres. The `Attachment` schema gains
       `storageProvider` and `blobUrl`; `downloadUrl` is a short-lived
       presigned GET URL generated on read rather than served by the API
       itself. A `POST /attachments/upload-url` endpoint is also added for
       clients that want to upload directly to blob storage (recommended
       for larger files, to avoid proxying bytes through the API tier).

  contact:
    name: LMS Engineering

servers:
  - url: /api/v1
    description: Default (VITE_API_BASE_URL). Versioned per the HLD's API Design Conventions — confirmed by the team; the frontend's base URL is being updated to match.
  - url: https://api.lms.example.com/api/v1
    description: Production (placeholder host — replace with actual deployment domain)

tags:
  - name: Auth
    description: Authentication, session refresh, and account recovery.
  - name: Users
    description: The authenticated user's own profile and credentials.
  - name: Dashboard
    description: Role-scoped summary widgets (Employee/Manager/HR dashboards).
  - name: Leave Requests
    description: Leave application lifecycle — submission, decisions, withdrawal.
  - name: Comp-Off
    description: Compensatory-off credit claims.
  - name: Leave Ledger
    description: Per-employee, per-category balance ledger (read-only; movements are system-generated).
  - name: Delegations
    description: Manager-to-delegate approval routing.
  - name: Holidays
    description: Organization/department holiday calendar.
  - name: Leave Categories
    description: HR-configured leave taxonomy (Casual, Sick, Earned, etc.).
  - name: Leave Policies
    description: HR-configured, versioned policy rules per category.
  - name: Departments
    description: Organizational units.
  - name: Employees
    description: HR administration of the employee master (app_users).
  - name: Team
    description: Manager-scoped team roster and calendar.
  - name: Reports
    description: Organization-wide / team-scoped analytics and exports.
  - name: Audit Trail
    description: Immutable log of state-changing actions.
  - name: Notifications
    description: The authenticated user's in-app notification inbox and preferences.
  - name: Notification Queue
    description: |
      HR/Admin operational monitor for outbound email/in-app delivery. Rows
      here are fanned out by a Kafka consumer from domain events published
      on `lms.notifications.v1` (see the outbox-pattern note in the top-level
      description) rather than written directly by request-handling code.
  - name: Settings
    description: Organization-wide system configuration (HR/Admin only).
  - name: Lookups
    description: Small reference/lookup lists (roles) used to populate form controls.

security:
  - bearerAuth: []

paths:
  # ============================================================ AUTH ============================================================
  /auth/register:
    post:
      tags: [Auth]
      summary: Self-register an account
      description: |
        x-assumption: true — inferred from the FE's existing `Register.jsx` page
        and the "Employee Self Registration" toggle on HR-08 Settings
        (`settings.systemPreferences.employeeSelfRegistration`).

        **Gated by that setting, and OFF by default.** Before creating an
        account, the server checks the current value of
        `employeeSelfRegistration`. If it is `false` (the default), the request
        is rejected with `403` and the exact user-facing message
        `"Contact HR to get enabled."` — surfaced verbatim by the client, not
        paraphrased. HR toggles this on/off from `PATCH /settings`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password, departmentId]
              properties:
                fullName: { type: string, maxLength: 120 }
                email: { type: string, format: email, maxLength: 150 }
                password: { type: string, format: password, minLength: 8 }
                departmentId: { type: integer }
                employeeCode: { type: string, maxLength: 20 }
      responses:
        '201':
          description: Account created (pending activation, depending on org policy).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403':
          description: Self-registration is disabled for this organization (default state).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                success: false
                error:
                  code: SELF_REGISTRATION_DISABLED
                  message: "Contact HR to get enabled."
                path: /auth/register
                timestamp: "2026-08-19T09:00:00Z"
        '409':
          description: Email or employee code already in use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with email and password
      description: |
        On success, sets an httpOnly, secure, SameSite refresh-token cookie and
        returns a short-lived access token in the JSON body, matching
        `AuthProvider.login()`. The frontend never reads or stores the refresh
        token directly.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Authenticated.
          headers:
            Set-Cookie:
              description: httpOnly refresh-token cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many attempts — rate-limited at the gateway (login is throttled per source IP per the HLD security design).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Silently exchange the refresh-token cookie for a new access token
      description: |
        Reads the httpOnly refresh-token cookie automatically (`credentials:
        'include'`); no request body. Matches `refreshTokenRequest()` /
        `apiService.refreshToken()`, which try `/auth/refresh` (with a
        `/refresh` fallback path also present in the FE's interceptor — that
        fallback is not modeled as a first-class path here since `/auth/refresh`
        is the documented primary contract).
      security: []
      responses:
        '200':
          description: New access token issued; refresh cookie rotated.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Refresh token missing, expired, or revoked — client should redirect to login.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate the current session
      description: Clears/revokes the refresh-token cookie server-side. Access token invalidation is left to natural expiry (stateless JWT).
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '204':
          description: Logged out (no content).

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password-reset OTP by email
      description: |
        Always returns 200 regardless of whether the email exists, per the
        UI/UX doc's explicit anti-enumeration design note (AUTH-02).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: If an account exists for this email, a reset OTP has been sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "If an account exists for this email, a reset link has been sent." }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Rate-limited at the gateway.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Complete password reset using the emailed OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword]
              properties:
                email: { type: string, format: email }
                otp: { type: string, minLength: 6, maxLength: 6, description: "6-digit one-time code, per AUTH-03." }
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  description: "Must satisfy the password policy: min 8 chars, 1 uppercase, 1 number, 1 special character (AUTH-03)."
      responses:
        '200':
          description: Password reset; the user should sign in again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '400':
          description: Validation error, or OTP invalid/expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ============================================================ USERS / PROFILE ============================================================
  /users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Users]
      summary: Update the authenticated user's editable profile fields
      description: |
        Only self-editable fields per EMP-09 (Personal Information and Emergency
        Contact cards). Employment fields (department, designation, manager) are
        HR-managed only — see `PATCH /employees/{employeeId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfileUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/password:
    post:
      tags: [Users]
      summary: Change the authenticated user's password
      description: EMP-09 "Change Password" form (current, new, confirm).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        '200':
          description: Password updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Current password incorrect, or not authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/me/avatar:
    post:
      tags: [Users]
      summary: Upload/replace the authenticated user's profile photo
      description: |
        x-assumption: true — inferred from the "Change Photo" action on EMP-09.
        Maximum file size: **10 MB**, enforced on both the client (pre-upload
        check) and the server (hard limit; `400 FILE_TOO_LARGE` if exceeded).

        The API stores the image in blob storage (`attachments` row with
        `entityType: USER_AVATAR`) rather than on local disk, then updates
        `app_users.avatar_url` to the resulting `blobUrl` so every screen
        that already reads `User.avatarUrl` picks it up without change. For
        avatars, the simple multipart path here is preferred over the
        presigned-URL flow given the small, bounded file size.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "Image file. Max size: 10 MB (10,485,760 bytes)."
      responses:
        '200':
          description: Uploaded to blob storage; profile updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatarUrl: { type: string, format: uri, description: "blobUrl of the newly stored attachments row; same value now on User.avatarUrl." }
        '400':
          description: Validation error, or file exceeds the 10 MB limit (`FILE_TOO_LARGE`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ============================================================ DASHBOARD ============================================================
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Employee dashboard KPI cards
      description: |
        Matches `apiService.getDashboardSummary()`. Shape confirmed against
        `mockSummary` in the FE (`availableLeave`, `usedLeave`, `pendingRequests`,
        `compOffBalance`).
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /dashboard/leave-trend:
    get:
      tags: [Dashboard]
      summary: "Employee \"Leave Usage Trend\" line-chart series (This Year)"
      parameters:
        - $ref: '#/components/parameters/YearQuery'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LeaveTrendPoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /dashboard/leave-distribution:
    get:
      tags: [Dashboard]
      summary: "Employee \"Leave Distribution\" donut-chart series"
      parameters:
        - $ref: '#/components/parameters/YearQuery'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LeaveDistributionSlice' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /manager/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Manager dashboard KPI cards (MGR-01)
      description: |
        CONFIRMED against `apiService.getManagerSummary()` and
        `mockManagerSummary` in the shipped frontend (`ManagerDashboard.jsx`).
        Note the path is under `/manager/...`, not `/dashboard/...` — the
        manager and employee dashboards are separate route namespaces.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerDashboardSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /manager/dashboard/leave-trend:
    get:
      tags: [Dashboard]
      summary: "Manager \"Leave Trend (Last N Months)\" chart series"
      description: Matches `apiService.getTeamLeaveTrend(months)`.
      parameters:
        - name: months
          in: query
          description: Trailing window size, in months.
          schema: { type: integer, default: 6 }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LeaveTrendPoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /manager/dashboard/leave-distribution:
    get:
      tags: [Dashboard]
      summary: "Manager \"Leave by Type This Month\" donut-chart series"
      description: Matches `apiService.getTeamLeaveDistribution()`.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LeaveDistributionSlice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /manager/approvals/pending:
    get:
      tags: [Dashboard]
      summary: "Manager dashboard \"Pending Approvals\" widget (top-N preview)"
      description: |
        Matches `apiService.getPendingApprovals(limit)`. This is a lightweight,
        dashboard-widget-sized preview — for the full paginated inbox with
        tab counts (All/Pending/Approved/Rejected), see
        `GET /approvals/inbox`.
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendingApprovalPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /manager/team/leave-overview:
    get:
      tags: [Team]
      summary: "Manager dashboard \"Team Leave Overview\" table, grouped by department"
      description: Matches `apiService.getTeamLeaveOverview()`.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TeamLeaveOverviewRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /manager/team/upcoming-leaves:
    get:
      tags: [Team]
      summary: "Manager dashboard \"Upcoming Leaves\" widget"
      description: Matches `apiService.getUpcomingTeamLeaves(limit)`.
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UpcomingTeamLeave' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /dashboard/hr-summary:
    get:
      tags: [Dashboard]
      summary: HR dashboard KPI cards
      description: "x-assumption: true — inferred from HR-01's KPI cards (Total/Active/On-Leave-Today/Inactive Employees)."
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalEmployees: { type: integer }
                  activeEmployees: { type: integer }
                  onLeaveToday: { type: integer }
                  inactiveEmployees: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ============================================================ LEAVE REQUESTS ============================================================
  /leave-requests:
    get:
      tags: [Leave Requests]
      summary: List leave requests
      description: |
        Employees see only their own requests. Managers additionally see direct
        reports' requests (and anything routed to them as an active delegate).
        HR/Admin sees all. Matches `apiService.getRecentRequests()`
        (`?limit=&sort=recent`) as a special case of this same endpoint.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LeaveRequestStatus' }
        - name: categoryId
          in: query
          schema: { type: integer }
        - name: userId
          in: query
          description: Filter to a specific employee. Manager/HR only; ignored (forced to self) for Employee role.
          schema: { type: integer }
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
        - name: sort
          in: query
          schema: { type: string, enum: [recent, oldest], default: recent }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Leave Requests]
      summary: Submit a new leave request (EMP-02 Apply Leave)
      description: |
        Server validates balance and date-overlap, computes `totalDays`
        excluding holidays/weekends, resolves the approver (delegate if an
        active delegation exists), and sets `status` to `PENDING_L1`. Passing
        `"status": "DRAFT"` saves without submitting (EMP-02 "Save Draft").
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveRequestInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Overlapping approved leave, or insufficient balance for the requested category.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /leave-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    get:
      tags: [Leave Requests]
      summary: Get a single leave request (EMP-04 / MGR-03 Request Details)
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Leave Requests]
      summary: Edit a DRAFT leave request
      description: Only permitted while `status = DRAFT` and the caller is the owner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveRequestInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Request is no longer in DRAFT status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /leave-requests/{requestId}/submit:
    post:
      tags: [Leave Requests]
      summary: Submit a DRAFT request for approval
      description: "x-assumption: true — companion to “Save Draft” on EMP-02; moves DRAFT → PENDING_L1 and resolves the approver."
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: Submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Request is not in DRAFT status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /leave-requests/{requestId}/withdraw:
    post:
      tags: [Leave Requests]
      summary: Withdraw a request (EMP-04 "Withdraw Request")
      description: Only permitted before final approval, per EMP-04's design note. Sets `status = WITHDRAWN`.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Withdrawn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Request has already reached a final decision and can no longer be withdrawn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /leave-requests/{requestId}/decisions:
    patch:
      tags: [Leave Requests]
      summary: Record an approval decision (MGR-02/MGR-03 Approve/Reject, HR-level escalation review)
      description: |
        Matches the HLD's documented convention `PATCH /api/v1/leave-requests/{id}/decisions`.
        Appends a row to the approval history rather than overwriting the
        request. On the terminal decision this triggers the leave-ledger update,
        a queued notification, and an audit-log entry (per HLD §05). If
        `total_days` exceeds the department's policy threshold, a manager
        APPROVED decision moves the request to `PENDING_L2` (HR/Admin) instead
        of resolving directly to `APPROVED`; comments are mandatory on rejection.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveDecisionInput' }
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403':
          description: Caller is not the current approver (or delegate) for this request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Request is not currently awaiting a decision from this caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /leave-requests/{requestId}/approvals:
    get:
      tags: [Leave Requests]
      summary: Approval history / timeline for a request
      description: Backs the "Approval Timeline" stepper on EMP-04 and the "Approval History" panel on MGR-03.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LeaveApproval' }
        '404': { $ref: '#/components/responses/NotFound' }

  /leave-requests/{requestId}/comments:
    get:
      tags: [Leave Requests]
      summary: Comment thread on a request (EMP-04 "Comments thread"; MGR-03 "Add Comment")
      description: "x-assumption: true — inferred from the Comments thread/tab documented on EMP-04 and MGR-03."
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Leave Requests]
      summary: Add a comment to a request
      description: "x-assumption: true — see GET on this path."
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '404': { $ref: '#/components/responses/NotFound' }

  /leave-requests/{requestId}/attachments:
    get:
      tags: [Leave Requests]
      summary: List attachments on a request
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Attachment' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Leave Requests]
      summary: Upload a supporting document (EMP-02 file attachment control)
      description: |
        RESOLVED (was an open question in UI/UX §10.3): maximum file size is
        **10 MB per file**, enforced on both the client (pre-upload check,
        EMP-02/EMP-04) and the server (hard limit; `400 FILE_TOO_LARGE` if
        exceeded). Multiple files may be attached via repeated calls to this
        endpoint, per EMP-02's "supporting multiple documents" note.

        The API streams the multipart body straight into blob storage (it is
        not written to local disk) and persists only the resulting
        `Attachment` metadata row, including a `blobUrl`. For larger files,
        prefer `POST /attachments/upload-url` + `PUT
        /leave-requests/{requestId}/attachments/{attachmentId}/confirm`
        instead, so bytes never transit the API tier at all.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "Max size: 10 MB (10,485,760 bytes) per file."
      responses:
        '201':
          description: Uploaded; blob stored and metadata persisted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400':
          description: Validation error, or file exceeds the 10 MB limit (`FILE_TOO_LARGE`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /leave-requests/{requestId}/attachments/{attachmentId}:
    get:
      tags: [Leave Requests]
      summary: Download an attachment
      description: |
        Issues a fresh, short-lived presigned GET URL against blob storage
        and redirects to it (`302`), rather than proxying the file bytes
        through the API. Clients that need the URL itself without following
        the redirect can instead call `GET .../attachments` and use the
        `downloadUrl` on the returned `Attachment`.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
        - name: attachmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '302':
          description: Redirect to a short-lived presigned blob-storage GET URL.
          headers:
            Location:
              schema: { type: string, format: uri }
        '404': { $ref: '#/components/responses/NotFound' }

  /attachments/upload-url:
    post:
      tags: [Leave Requests]
      summary: Get a presigned URL to upload a file directly to blob storage
      description: |
        x-assumption: true — added alongside the blob-storage migration as
        the preferred upload path (EMP-02 attachments, EMP-09 avatar, HR-04
        holiday import, HR-01 employee import all funnel through this same
        endpoint via their `entityType`). The client PUTs the raw file
        directly to `uploadUrl`; the API never sees the bytes. A `PENDING`
        `Attachment` row is created immediately so the client has an
        `attachmentId` to confirm once the PUT succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentUploadUrlInput' }
      responses:
        '201':
          description: Presigned URL issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentUploadUrl' }
        '400':
          description: Validation error, or requested size exceeds the 10 MB limit (`FILE_TOO_LARGE`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /attachments/{attachmentId}/confirm:
    post:
      tags: [Leave Requests]
      summary: Confirm a direct-to-blob-storage upload completed successfully
      description: |
        x-assumption: true — companion to `POST /attachments/upload-url`.
        The server verifies the object exists in blob storage at the
        expected key (and, where the provider supports it, that its size
        matches), then flips the `Attachment` row from `PENDING` to
        `ACTIVE` and populates `blobUrl`. If `entityId` wasn't known at
        upload-url time (e.g. a not-yet-created leave request), it can be
        supplied here to link the attachment to its parent.
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entityId: { type: integer }
      responses:
        '200':
          description: Confirmed; attachment is now ACTIVE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: No object found in blob storage at the expected key (upload never completed, or expired).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /leave-requests/{requestId}/pdf:
    get:
      tags: [Leave Requests]
      summary: Download the request as a PDF (EMP-04 "Download as PDF")
      description: "x-assumption: true — inferred from EMP-04's documented action."
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: PDF file.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /leave-requests/export:
    get:
      tags: [Leave Requests]
      summary: Export the caller's filtered request list (EMP-03 "Export")
      description: "x-assumption: true — inferred from the Export action on EMP-03; same filters as GET /leave-requests."
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LeaveRequestStatus' }
        - name: categoryId
          in: query
          schema: { type: integer }
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
        - name: format
          in: query
          schema: { type: string, enum: [csv, xlsx], default: csv }
      responses:
        '200':
          description: File stream.
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  # ============================================================ APPROVAL INBOX (Manager) ============================================================
  /approvals/inbox:
    get:
      tags: [Leave Requests]
      summary: Manager/HR approval inbox (MGR-02), with per-tab counts
      description: |
        x-assumption: true (as a distinct convenience endpoint) — functionally a
        filtered view of `GET /leave-requests` scoped to `currentApproverId =
        me`, but returns the tab counts (All/Pending/Approved/Rejected) MGR-02
        requires in one call rather than four.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ALL, PENDING, APPROVED, REJECTED]
            default: PENDING
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: sort
          in: query
          schema: { type: string, enum: [newest, oldest], default: newest }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      counts:
                        type: object
                        properties:
                          all: { type: integer }
                          pending: { type: integer }
                          approved: { type: integer }
                          rejected: { type: integer }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ============================================================ COMP-OFF ============================================================
  /comp-off-requests:
    get:
      tags: [Comp-Off]
      summary: List comp-off claims (EMP-06 "My Requests" / "Earned History" tabs)
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CompOffStatus' }
        - name: userId
          in: query
          description: Manager/HR only.
          schema: { type: integer }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CompOffRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Comp-Off]
      summary: Claim a comp-off credit (EMP-06 "Request Comp-Off")
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompOffRequestInput' }
      responses:
        '201':
          description: Created, status PENDING.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompOffRequest' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /comp-off-requests/{compId}:
    parameters:
      - name: compId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Comp-Off]
      summary: Get a single comp-off claim
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompOffRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Comp-Off]
      summary: Withdraw a comp-off claim before it is actioned
      description: "x-assumption: true — symmetric with leave-request withdraw; only permitted while status = PENDING."
      responses:
        '204':
          description: Withdrawn.
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Claim already decided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /comp-off-requests/{compId}/decisions:
    patch:
      tags: [Comp-Off]
      summary: Approve/reject a comp-off claim
      description: |
        Single-level decision (manager only — comp-off does not escalate to HR
        per HLD §05). On approval, credits `leave_ledger.accrued` with an
        `expiry_date`, per the DB design's comp-off business rules.
      parameters:
        - name: compId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompOffDecisionInput' }
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompOffRequest' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


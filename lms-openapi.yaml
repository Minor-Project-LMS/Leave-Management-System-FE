      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Holiday' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Holidays]
      summary: Remove a holiday
      responses:
        '204':
          description: Deleted.
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /holidays/import:
    post:
      tags: [Holidays]
      summary: Bulk-import holidays (HR-04 "Import Holidays")
      description: |
        x-assumption: true — inferred from HR-04's Quick Actions.
        Maximum file size: **10 MB**, enforced on both the client and the
        server (`400 FILE_TOO_LARGE` if exceeded).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "CSV/XLSX of holidays. Max size: 10 MB (10,485,760 bytes)."
      responses:
        '200':
          description: Import summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  skipped: { type: integer }
                  errors:
                    type: array
                    items: { type: string }
        '400':
          description: Validation error, malformed file, or file exceeds the 10 MB limit (`FILE_TOO_LARGE`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ============================================================ LEAVE CATEGORIES ============================================================
  /leave-categories:
    get:
      tags: [Leave Categories]
      summary: List leave categories (HR-03; also feeds the Leave Type dropdown on EMP-02)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE] }
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Leave Categories]
      summary: Create a leave category (HR-03 "Add New Category")
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveCategoryInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveCategory' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Category name already in use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /leave-categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Leave Categories]
      summary: Get a single leave category
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveCategory' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Leave Categories]
      summary: Update a leave category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveCategoryInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveCategory' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Leave Categories]
      summary: Deactivate a leave category
      description: |
        System-defined categories cannot be hard-deleted, only deactivated, per
        HR-03's design note; this endpoint sets `status = INACTIVE` rather than
        removing the row. Returns 409 if the category is a protected system
        category and the caller attempted a request implying permanent removal.
      responses:
        '204':
          description: Deactivated.
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================ LEAVE POLICIES ============================================================
  /leave-policies:
    get:
      tags: [Leave Policies]
      summary: List leave policies (HR-02)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, DRAFT, ARCHIVED] }
        - name: categoryId
          in: query
          schema: { type: integer }
        - name: departmentId
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LeavePolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Leave Policies]
      summary: Create a new policy version (HR-02 "Create New Policy")
      description: |
        Policies are versioned by `effective_from` rather than edited in place
        (HLD/DB design principle), so this always creates a new row; it never
        mutates a policy that has already governed approved requests.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeavePolicyInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeavePolicy' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /leave-policies/{policyId}:
    parameters:
      - name: policyId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Leave Policies]
      summary: Get a single policy version
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeavePolicy' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Leave Policies]
      summary: Update a DRAFT policy, or change an ACTIVE/DRAFT policy's status
      description: |
        Only non-effective-date fields and `status` transitions (DRAFT →
        ACTIVE → ARCHIVED) are mutable once a policy has been used; the
        server rejects (409) any attempt to change quota/threshold values on a
        policy that already governs decided requests.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeavePolicyInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeavePolicy' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Policy already governs historical, decided requests and cannot be altered in place.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /leave-policies/{policyId}/history:
    get:
      tags: [Leave Policies]
      summary: Version history for a policy's category/department (HR-02 "Policy History")
      description: "x-assumption: true — inferred from HR-02's Quick Actions."
      parameters:
        - name: policyId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LeavePolicy' }
        '404': { $ref: '#/components/responses/NotFound' }


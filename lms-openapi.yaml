        schema: { type: integer }
    get:
      tags: [Holidays]
      summary: Get a single holiday
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Holiday' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Holidays]
      summary: Update a holiday
      requestBody:
        required: true
        content:

  /reports/export:
    post:
      tags: [Reports]
      summary: Generate and export a report (HR-05 "Export Report")
      description: |
        x-assumption: true — modeled as an async job (`PENDING` → `READY` /
        `FAILED`) since org-wide report generation can be long-running; poll
        `GET /reports/export/{jobId}` for the download URL. If report generation
        is fast enough to be synchronous in practice, this can be collapsed into
        a single streaming GET, mirroring `/leave-requests/export`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportType]
              properties:
                reportType:
                  type: string
                  enum: [LEAVE_SUMMARY, DEPARTMENT_SUMMARY, TOP_EMPLOYEES, LEAVE_TREND]
                dateFrom: { type: string, format: date }
                dateTo: { type: string, format: date }
                departmentId: { type: integer }
                format: { type: string, enum: [csv, xlsx, pdf], default: xlsx }
      responses:
        '202':
          description: Export job accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string }
                  status: { type: string, enum: [PENDING] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/export/{jobId}:
    get:
      tags: [Reports]
      summary: Poll a report export job / retrieve its download URL
      description: "x-assumption: true — see POST /reports/export."
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string }
                  status: { type: string, enum: [PENDING, READY, FAILED] }
                  downloadUrl: { type: string, format: uri, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================ AUDIT TRAIL ============================================================
  /audit-log:
    get:
      tags: [Audit Trail]
      summary: Search the audit trail (HR-06)
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          schema: { type: string, format: date-time }
        - name: userId
          in: query
          schema: { type: integer }
        - name: action
          in: query
          schema: { $ref: '#/components/schemas/AuditAction' }
        - name: entityType
          in: query
          description: "\"Module\" filter on HR-06 (e.g. LEAVE_REQUEST, LEAVE_LEDGER, DELEGATION)."
          schema: { type: string }
        - name: q
          in: query
          description: Keyword search across description fields.
          schema: { type: string }
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditLogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /audit-log/recent:
    get:
      tags: [Audit Trail]
      summary: Recent activity feed (EMP-01 "Recent Activity")
      description: Matches `apiService.getRecentActivity(limit)`.
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditLogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /audit-log/{auditId}:
    get:
      tags: [Audit Trail]
      summary: Get a single audit entry, including before/after snapshots
      parameters:
        - name: auditId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogEntryDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /audit-log/export:
    get:
      tags: [Audit Trail]
      summary: Export the audit log (HR-06 "Export Log")
      description: "x-assumption: true — inferred from HR-06's Export Log action; same filters as GET /audit-log."
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          schema: { type: string, format: date-time }
        - name: format
          in: query
          schema: { type: string, enum: [csv, xlsx], default: csv }
      responses:
        '200':
          description: File stream.
          content:
            text/csv:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ============================================================ NOTIFICATIONS (in-app inbox) ============================================================
  /notifications:
    get:
      tags: [Notifications]
      summary: The caller's in-app notification inbox (EMP-08)
      parameters:
        - name: tab
          in: query
          schema: { type: string, enum: [all, unread, requests, approvals, system], default: all }
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      unreadCount: { type: integer }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      summary: Mark a single notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications/mark-all-read:
    post:
      tags: [Notifications]
      summary: "Bulk mark-as-read (EMP-08 \"Mark all as read\")"
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }

  /notifications/preferences:
    get:
      tags: [Notifications]
      summary: Get the caller's per-category notification preferences (EMP-08)
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Notifications]
      summary: Update notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ============================================================ NOTIFICATION QUEUE (HR ops) ============================================================
  /notification-queue:
    get:
      tags: [Notification Queue]
      summary: Operational monitor for outbound notifications (HR-07)
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/NotificationQueueStatus' }
        - name: channel
          in: query
          schema: { $ref: '#/components/schemas/NotificationChannel' }
        - name: templateCode
          in: query
          description: "\"Type\" filter on HR-07."
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/NotificationQueueItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /notification-queue/{notificationId}/retry:
    post:
      tags: [Notification Queue]
      summary: Retry a single failed notification (HR-07 row action)
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Re-queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationQueueItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "Notification has already reached the 3-retry cap noted on HR-07 and requires manual intervention."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /notification-queue/retry-failed:
    post:
      tags: [Notification Queue]
      summary: "Bulk retry (HR-07 \"Retry Failed Notifications\")"
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requeued: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /notification-queue/{notificationId}/cancel:
    post:
      tags: [Notification Queue]
      summary: "Cancel a scheduled/queued notification (HR-07 \"Cancel Scheduled\")"
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationQueueItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Notification has already been sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /notification-queue/export:
    get:
      tags: [Notification Queue]
      summary: "Export queue logs (HR-07 \"Export Queue Logs\")"
      description: "x-assumption: true — inferred from HR-07's Quick Actions."
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: File stream.
          content:
            text/csv:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ============================================================ SETTINGS ============================================================
  /settings:
    get:
      tags: [Settings]
      summary: Get system-wide configuration (HR-08)
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Settings]
      summary: Update system-wide configuration
      description: Partial update — only the tab(s)/fields being changed need be sent, per HR-08's per-tab "Save Changes" pattern.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemSettings' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ============================================================ LOOKUPS ============================================================
  /roles:
    get:
      tags: [Lookups]
      summary: List system roles (user_roles lookup)
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleLookup' }
        '401': { $ref: '#/components/responses/Unauthorized' }

# ================================================================================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer JWT issued by `POST /auth/login` / `POST /auth/refresh`, sent as
        `Authorization: Bearer <token>` on every call except `/auth/login`,
        `/auth/register`, `/auth/refresh`, `/auth/forgot-password`, and
        `/auth/reset-password` (HLD §09 API Design Conventions). The refresh
        token itself travels only as an httpOnly cookie and is never exposed to
        this bearer scheme.

  parameters:
    PageQuery:
      name: page
      in: query
      description: 1-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    LimitQuery:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    YearQuery:
      name: year
      in: query
      schema: { type: integer }
    RequestIdPath:
      name: requestId
      in: path
      required: true
      schema: { type: integer }

  responses:
    ValidationError:
      description: Request failed field-level validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid/expired access token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated, but the caller's role does not permit this action.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource does not exist, or is not visible to the caller.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------- Envelope / shared ----------
    Error:
      type: object
      description: Standard error envelope (HLD §09 API Design Conventions).
      required: [success, error, path, timestamp]
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: "VALIDATION_ERROR" }
            message: { type: string, example: "The request could not be processed." }
            fieldErrors:
              type: array
              description: Present on HTTP 400 field-level validation failures.
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
        path: { type: string, example: "/leave-requests" }
        timestamp: { type: string, format: date-time }

    PagedResponse:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        totalCount: { type: integer, example: 137 }
        totalPages: { type: integer, example: 7 }

    Comment:
      type: object
      properties:
        id: { type: integer }
        requestId: { type: integer }
        authorId: { type: integer }
        authorName: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }

    Attachment:
      type: object
      description: |
        Metadata for a file held in blob storage. The API never returns raw
        bytes for this resource except via the dedicated download endpoint —
        `blobUrl`/`downloadUrl` are what the UI actually fetches/renders.
      properties:
        id: { type: integer }
        entityType:
          type: string
          enum: [LEAVE_REQUEST, COMP_OFF_REQUEST, USER_AVATAR, EMPLOYEE_IMPORT, HOLIDAY_IMPORT]
        entityId: { type: integer, nullable: true }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        storageProvider:
          type: string
          enum: [S3, AZURE_BLOB, GCS]
          readOnly: true
          description: Which blob store the object lives in. Informational; clients never need to branch on this.
        status:
          type: string
          enum: [PENDING, ACTIVE, DELETED]
          readOnly: true
          description: PENDING until an upload started via the presigned-URL flow is confirmed; DELETED is a soft-delete.
        blobUrl:
          type: string
          format: uri
          nullable: true
          description: CDN URL, or the last-issued presigned GET URL — the link the UI uses to render/preview the file (e.g. an avatar `<img>` src).
        downloadUrl:
          type: string
          format: uri
          description: A freshly-issued, short-lived presigned GET URL for downloading this specific file, returned by GET .../attachments/{id}.
        uploadedBy: { type: integer }
        uploadedAt: { type: string, format: date-time }

    AttachmentUploadUrlInput:
      type: object
      description: Request a presigned URL to upload a file directly to blob storage, bypassing the API tier for the bytes themselves.
      required: [fileName, contentType, sizeBytes, entityType]
      properties:
        fileName: { type: string, maxLength: 255 }
        contentType: { type: string, example: "application/pdf" }
        sizeBytes:
          type: integer
          description: Must not exceed 10 MB (10,485,760 bytes); the server rejects larger requests with 400 FILE_TOO_LARGE before issuing a URL.
        entityType:
          type: string
          enum: [LEAVE_REQUEST, COMP_OFF_REQUEST, USER_AVATAR, EMPLOYEE_IMPORT, HOLIDAY_IMPORT]
        entityId:
          type: integer
          nullable: true
          description: Omit when the parent record (e.g. a DRAFT leave request) doesn't exist yet; attach it afterward via the entity's own attachments endpoint.

    AttachmentUploadUrl:
      type: object
      properties:
        attachmentId:
          type: integer
          description: A PENDING Attachment row created for this upload; call PATCH on it (or it auto-activates) once the client-side PUT to uploadUrl succeeds.
        uploadUrl:
          type: string
          format: uri
          description: Presigned PUT URL. The client uploads the raw file bytes directly here with an HTTP PUT — this call does not go through the LMS API.
        storageKey:
          type: string
          description: Internal object key, echoed back for reference; not required by the client.
        expiresAt:
          type: string
          format: date-time
          description: Upload URL validity window, typically 15 minutes.

    # ---------- Enums ----------
    Role:
      type: string
      enum: [EMPLOYEE, MANAGER, HR_ADMIN]
    RoleLookup:
      type: object
      properties:
        roleId: { type: integer }
        roleCode: { $ref: '#/components/schemas/Role' }
        roleDescription: { type: string }
    EmploymentStatus:
      type: string
      enum: [ACTIVE, ON_LEAVE, SEPARATED]
    LeaveRequestStatus:
      type: string
      enum: [DRAFT, PENDING_L1, PENDING_L2, APPROVED, REJECTED, CANCELLED, WITHDRAWN]
    SessionType:
      type: string
      enum: [FULL_DAY, FIRST_HALF, SECOND_HALF]
    CompOffStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, EXPIRED]
    HolidayType:
      type: string
      enum: [NATIONAL, FESTIVAL, OPTIONAL, COMPANY, RESTRICTED]
    NotificationChannel:
      type: string
      enum: [EMAIL, IN_APP]
    NotificationQueueStatus:
      type: string
      enum: [QUEUED, SENT, FAILED, IN_PROGRESS, CANCELLED]
    AuditAction:
      type: string
      enum: [CREATE, UPDATE, APPROVE, REJECT, CANCEL, DELEGATE, DELETE]
    ApprovalLevel:
      type: integer
      description: "1 = manager, 2 = HR/Admin (triggered above the department's policy threshold)."
      enum: [1, 2]

    # ---------- Auth / Users ----------
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string, description: "Short-lived JWT; kept in memory by the client, never persisted to storage." }
        tokenType: { type: string, example: "Bearer" }
        expiresIn: { type: integer, description: "Access-token lifetime in seconds.", example: 900 }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      properties:
        id: { type: integer, example: 1042 }
        employeeCode: { type: string, example: "EMP-1042" }
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        departmentId: { type: integer }
        departmentName: { type: string }
        designation: { type: string }
        reportsTo:
          type: integer
          nullable: true
          description: "user_id of the direct manager."
        reportsToName: { type: string, nullable: true }
        dateOfJoining: { type: string, format: date }
        employmentStatus: { $ref: '#/components/schemas/EmploymentStatus' }
        workLocation: { type: string }
        employmentType: { type: string, example: "Full-Time" }
        avatarUrl: { type: string, format: uri, nullable: true }
        dateOfBirth: { type: string, format: date, nullable: true }
        gender: { type: string, nullable: true }
        bloodGroup: { type: string, nullable: true }
        address: { type: string, nullable: true }
        emergencyContact:
          type: object
          nullable: true
          properties:
            name: { type: string }
            relationship: { type: string }
            phone: { type: string }
            email: { type: string, format: email }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserProfileUpdate:
      type: object
      description: Self-editable subset of User (EMP-09 "Personal Information" and "Emergency Contact" cards).
      properties:
        phone: { type: string }
        dateOfBirth: { type: string, format: date }
        gender: { type: string }
        bloodGroup: { type: string }
        address: { type: string }
        emergencyContact:
          type: object
          properties:
            name: { type: string }
            relationship: { type: string }
            phone: { type: string }
            email: { type: string, format: email }

    Employee:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          description: Same shape as User; exposed under /employees for HR administration.

    EmployeeInput:
      type: object
      required: [fullName, email, departmentId, role, dateOfJoining]
      properties:
        employeeCode: { type: string, maxLength: 20 }
        fullName: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 150 }
        phone: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        departmentId: { type: integer }
        designation: { type: string }
        reportsTo: { type: integer, nullable: true }
        dateOfJoining: { type: string, format: date }
        employmentStatus: { $ref: '#/components/schemas/EmploymentStatus' }
        workLocation: { type: string }
        employmentType: { type: string }

    # ---------- Dashboard ----------
    DashboardSummary:
      type: object
      properties:
        availableLeave: { type: number, format: float, example: 18.5 }
        usedLeave: { type: number, format: float, example: 7.5 }
        pendingRequests: { type: integer, example: 2 }
        compOffBalance: { type: number, format: float, example: 1.0 }

    LeaveTrendPoint:
      type: object
      properties:
        month: { type: string, example: "Jan" }
        days: { type: number, format: float, example: 4 }

    LeaveDistributionSlice:
      type: object
      properties:
        label: { type: string, example: "Casual Leave" }
        value: { type: number, format: float, example: 6 }
        color: { type: string, example: "#2563eb" }

    ManagerDashboardSummary:
      type: object
      description: "CONFIRMED against `mockManagerSummary` in the shipped frontend."
      properties:
        totalTeamSize: { type: integer, example: 28 }
        activeEmployees: { type: integer, example: 26 }
        pendingApprovals: { type: integer, example: 5 }
        pendingUrgent:
          type: boolean
          example: true
          description: "Flags whether any pending item is at risk of breaching its SLA window, driving the urgency indicator on the KPI card."
        leavesThisMonth: { type: integer, example: 18 }
        leavesThisMonthChangePct:
          type: number
          format: float
          example: 12
          description: "Percentage change vs. the prior month; sign indicates increase/decrease."
        availableBalanceAvg:
          type: number
          format: float
          example: 16.2
          description: "Average available leave balance across the team, in days."

    PendingApprovalPreview:
      type: object
      description: "CONFIRMED against `mockPendingApprovals`. A condensed row for the dashboard widget — see LeaveRequest for the full resource."
      properties:
        id: { type: string, example: "LR-2024-201", description: "displayId of the underlying leave request." }
        name: { type: string, example: "Priya Sharma", description: "Requesting employee's display name." }
        type: { type: string, example: "Casual Leave" }
        dateRange: { type: string, example: "20 May 2024", description: "Pre-formatted display string." }
        days: { type: number, format: float, example: 1 }

    TeamLeaveOverviewRow:
      type: object
      description: "CONFIRMED against `mockTeamLeaveOverview`. One row per department under the manager's org scope."
      properties:
        department: { type: string, example: "Engineering" }
        totalMembers: { type: integer, example: 14 }
        onLeaveToday: { type: integer, example: 2 }
        leavesThisMonth: { type: integer, example: 8 }
        availableBalanceAvg: { type: number, format: float, example: 15.6 }

    UpcomingTeamLeave:
      type: object
      description: "CONFIRMED against `mockUpcomingTeamLeaves`."
      properties:
        day: { type: string, example: "27", description: "Day-of-month, pre-formatted 2-digit string for calendar-tile display." }
        month: { type: string, example: "MAY", description: "3-letter month abbreviation, uppercase." }
        name: { type: string, example: "Sneha Patel" }
        type: { type: string, example: "Earned Leave" }
        dateRange: { type: string, example: "27 May - 29 May 2024" }

    # ---------- Leave Requests ----------
    LeaveRequestInput:
      type: object
      required: [categoryId, startDate, endDate, sessionType, reason]
      properties:
        categoryId: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        sessionType: { $ref: '#/components/schemas/SessionType' }
        reason: { type: string, maxLength: 2000 }
        contactNumber: { type: string }
        addressDuringLeave: { type: string }
        handoverTo: { type: integer, nullable: true, description: "user_id of the coverage/handover contact." }
        handoverNotes: { type: string, nullable: true }
        status:
          type: string
          enum: [DRAFT, PENDING_L1]
          default: PENDING_L1
          description: "Send DRAFT for “Save Draft”; omit or send PENDING_L1 to submit immediately."
        attachmentIds:
          type: array
          items: { type: integer }
          description: "IDs from prior POST /leave-requests/{requestId}/attachments calls, if attaching before the parent request exists is supported by the client flow; otherwise attach after creation."

    LeaveRequest:
      type: object
      properties:
        id: { type: integer, example: 10452 }
        displayId: { type: string, example: "LR-2024-125" }
        userId: { type: integer }
        employeeName: { type: string }
        categoryId: { type: integer }
        categoryName: { type: string, example: "Casual Leave" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        sessionType: { $ref: '#/components/schemas/SessionType' }
        totalDays: { type: number, format: float, example: 3 }
        reason: { type: string }
        status: { $ref: '#/components/schemas/LeaveRequestStatus' }
        currentApproverId: { type: integer, nullable: true }
        currentApproverName: { type: string, nullable: true }
        appliedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LeaveRequestDetail:
      allOf:
        - $ref: '#/components/schemas/LeaveRequest'
        - type: object
          properties:
            contactNumber: { type: string }
            addressDuringLeave: { type: string }
            handoverTo: { type: integer, nullable: true }
            handoverToName: { type: string, nullable: true }
            handoverNotes: { type: string, nullable: true }
            employee: { $ref: '#/components/schemas/User' }
            balanceAsOfRequestDate:
              type: array
              items: { $ref: '#/components/schemas/LeaveLedgerSummary' }
            attachments:
              type: array
              items: { $ref: '#/components/schemas/Attachment' }
            approvals:
              type: array
              items: { $ref: '#/components/schemas/LeaveApproval' }
            teamImpact:
              type: array
              nullable: true
              description: "MGR-03 “Team Impact” tab — overlapping team commitments and backup coverage, where available."
              items:
                type: object
                properties:
                  description: { type: string }
                  backupPerson: { type: string, nullable: true }

    LeaveDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVED, REJECTED] }
        comments:
          type: string
          maxLength: 2000
          description: Mandatory when decision = REJECTED (DB design's leave_approvals.comments note).

    LeaveApproval:
      type: object
      properties:
        id: { type: integer }
        requestId: { type: integer }
        approverId: { type: integer }
        approverName: { type: string }
        actingAsDelegateFor: { type: integer, nullable: true, description: "user_id of the manager being covered, if this decision was made by a delegate." }
        level: { $ref: '#/components/schemas/ApprovalLevel' }
        decision: { type: string, enum: [APPROVED, REJECTED] }
        decidedAt: { type: string, format: date-time }
        comments: { type: string, nullable: true }

    # ---------- Comp-Off ----------
    CompOffRequestInput:
      type: object
      required: [workedOn, reason, hoursWorked]
      properties:
        workedOn: { type: string, format: date, description: "The holiday/weekend date worked." }
        reason: { type: string, maxLength: 2000 }
        hoursWorked: { type: number, format: float, description: "Used by the server to derive daysCredited (typically 0.5 or 1.0) per policy." }

    CompOffRequest:
      type: object
      properties:
        id: { type: integer }
        displayId: { type: string, example: "CO-2024-014" }
        userId: { type: integer }
        employeeName: { type: string }
        workedOn: { type: string, format: date }
        reason: { type: string }
        daysCredited: { type: number, format: float, example: 1.0 }
        expiryDate: { type: string, format: date, nullable: true }
        status: { $ref: '#/components/schemas/CompOffStatus' }
        approverId: { type: integer, nullable: true }
        approverName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CompOffDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVED, REJECTED] }
        comments: { type: string, maxLength: 2000 }

    # ---------- Leave Ledger ----------
    LeaveLedgerSummary:
      type: object
      properties:
        categoryId: { type: integer }
        categoryName: { type: string }
        fiscalYear: { type: integer }
        openingBalance: { type: number, format: float }
        accrued: { type: number, format: float }
        used: { type: number, format: float }
        encashed: { type: number, format: float }
        carriedForward: { type: number, format: float }
        closingBalance: { type: number, format: float }
        availableBalance: { type: number, format: float, description: "closingBalance, surfaced for UI clarity." }

    LeaveLedgerTransaction:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        categoryId: { type: integer }
        categoryName: { type: string }
        description: { type: string }
        credit: { type: number, format: float, nullable: true }
        debit: { type: number, format: float, nullable: true }
        runningBalance: { type: number, format: float }
        referenceType: { type: string, example: "LEAVE_REQUEST" }
        referenceId: { type: integer }

    # ---------- Delegations ----------
    DelegationInput:
      type: object
      required: [delegateId, startDate, endDate]
      properties:
        delegateId: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        departmentIds:
          type: array
          items: { type: integer }
          description: "Scope by department; omit/empty for “All Departments” (MGR-06)."
        categoryIds:
          type: array
          items: { type: integer }
          description: "Scope by leave type; omit/empty for “All Types” (MGR-06)."

    Delegation:
      type: object
      properties:
        id: { type: integer }
        delegatorId: { type: integer }
        delegatorName: { type: string }
        delegateId: { type: integer }
        delegateName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        isActive: { type: boolean }
        computedStatus:
          type: string
          enum: [ACTIVE, UPCOMING, PAST, REVOKED]
          description: Derived server-side from isActive + start/end date, for the MGR-06 tabs.
        departmentIds:
          type: array
          items: { type: integer }
        categoryIds:
          type: array
          items: { type: integer }
        createdAt: { type: string, format: date-time }

    # ---------- Holidays ----------
    HolidayInput:
      type: object
      required: [holidayName, holidayDate, holidayType]
      properties:
        holidayName: { type: string, maxLength: 100 }
        holidayDate: { type: string, format: date }
        departmentId: { type: integer, nullable: true, description: "NULL = organization-wide." }
        holidayType: { $ref: '#/components/schemas/HolidayType' }
        isRestricted: { type: boolean, default: false, description: "Optional/floater holiday flag." }
        location: { type: string, nullable: true }

    Holiday:
      type: object
      properties:
        id: { type: integer }
        holidayName: { type: string }
        holidayDate: { type: string, format: date }
        day: { type: string, example: "Wed" }
        departmentId: { type: integer, nullable: true }
        holidayType: { $ref: '#/components/schemas/HolidayType' }
        isRestricted: { type: boolean }
        location: { type: string, nullable: true }

    # ---------- Leave Categories ----------
    LeaveCategoryInput:
      type: object
      required: [categoryName, isPaid]
      properties:
        categoryName: { type: string, maxLength: 50 }
        categoryCode: { type: string, maxLength: 20 }
        categoryType:
          type: string
          enum: [STANDARD, ACCRUAL, COMPENSATORY, SPECIAL, OTHER]
        applicableTo:
          type: string
          enum: [ALL_EMPLOYEES, MALE, FEMALE, DEPARTMENT_SPECIFIC]
          default: ALL_EMPLOYEES
        isPaid: { type: boolean }
        requiresDocument: { type: boolean, default: false }
        defaultAnnualQuota: { type: number, format: float }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }

    LeaveCategory:
      allOf:
        - $ref: '#/components/schemas/LeaveCategoryInput'
        - type: object
          properties:
            id: { type: integer }
            isSystemCategory: { type: boolean, description: "System-defined categories can only be deactivated, never deleted (HR-03)." }

    # ---------- Leave Policies ----------
    LeavePolicyInput:
      type: object
      required: [categoryId, annualQuota, effectiveFrom]
      properties:
        policyName: { type: string }
        policyCode: { type: string }
        categoryId: { type: integer }
        departmentId: { type: integer, nullable: true, description: "NULL = organization-wide." }
        annualQuota: { type: number, format: float }
        maxCarryForward: { type: number, format: float }
        minNoticeDays: { type: integer }
        maxConsecutiveDays: { type: integer }
        accrualFrequency:
          type: string
          enum: [ANNUAL, MONTHLY, QUARTERLY]
        effectiveFrom: { type: string, format: date }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED], default: DRAFT }

    LeavePolicy:
      allOf:
        - $ref: '#/components/schemas/LeavePolicyInput'
        - type: object
          properties:
            id: { type: integer }
            categoryName: { type: string }
            departmentName: { type: string, nullable: true }
            createdAt: { type: string, format: date-time }

    # ---------- Departments ----------
    DepartmentInput:
      type: object
      required: [departmentName]
      properties:
        departmentName: { type: string, maxLength: 100 }
        departmentHeadId: { type: integer, nullable: true }

    Department:
      allOf:
        - $ref: '#/components/schemas/DepartmentInput'
        - type: object
          properties:
            id: { type: integer }
            departmentHeadName: { type: string, nullable: true }
            memberCount: { type: integer }

    # ---------- Team ----------
    TeamMember:
      type: object
      properties:
        id: { type: integer }
        employeeCode: { type: string }
        fullName: { type: string }
        departmentId: { type: integer }
        departmentName: { type: string }
        designation: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        status:
          type: string
          enum: [AVAILABLE, ON_LEAVE]
        avatarUrl: { type: string, format: uri, nullable: true }

    TeamCalendarDay:
      type: object
      properties:
        date: { type: string, format: date }
        entries:
          type: array
          items:
            type: object
            properties:
              userId: { type: integer }
              fullName: { type: string }
              avatarUrl: { type: string, format: uri, nullable: true }
              categoryId: { type: integer }
              categoryName: { type: string }
              sessionType: { $ref: '#/components/schemas/SessionType' }

    # ---------- Reports ----------
    ReportSummary:
      type: object
      properties:
        totalLeavesTaken: { type: number, format: float }
        totalEmployees: { type: integer }
        avgLeavePerEmployee: { type: number, format: float }
        approvalRate: { type: number, format: float, description: "Percentage, 0-100." }
        pendingRequests: { type: integer }
        insights:
          type: array
          description: "Auto-generated “Insights & Observations” narrative bullets (HR-05)."
          items: { type: string }

    # ---------- Audit Trail ----------
    AuditLogEntry:
      type: object
      properties:
        id: { type: integer }
        entityType: { type: string, example: "LEAVE_REQUEST" }
        entityId: { type: integer }
        action: { $ref: '#/components/schemas/AuditAction' }
        performedBy: { type: integer }
        performedByName: { type: string }
        description: { type: string }
        module: { type: string, example: "Leave Requests" }
        status: { type: string, enum: [SUCCESS, FAILED], default: SUCCESS }
        ipAddress: { type: string }
        performedAt: { type: string, format: date-time }

    AuditLogEntryDetail:
      allOf:
        - $ref: '#/components/schemas/AuditLogEntry'
        - type: object
          properties:
            beforeState:
              type: object
              additionalProperties: true
              nullable: true
            afterState:
              type: object
              additionalProperties: true
              nullable: true

    # ---------- Notifications ----------
    Notification:
      type: object
      properties:
        id: { type: integer }
        category: { type: string, enum: [REQUESTS, APPROVALS, SYSTEM] }
        title: { type: string }
        description: { type: string }
        isRead: { type: boolean }
        relatedEntityType: { type: string, nullable: true }
        relatedEntityId: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }

    NotificationPreferences:
      type: object
      properties:
        leaveRequestUpdates: { type: boolean }
        approvalNotifications: { type: boolean }
        compOffUpdates: { type: boolean }
        policyUpdates: { type: boolean }
        systemNotifications: { type: boolean }
        holidayReminders: { type: boolean }

    NotificationQueueItem:
      type: object
      properties:
        id: { type: integer }
        recipientId: { type: integer }
        recipientName: { type: string }
        templateCode: { type: string, example: "LEAVE_APPROVED" }
        subject: { type: string }
        channel: { $ref: '#/components/schemas/NotificationChannel' }
        status: { $ref: '#/components/schemas/NotificationQueueStatus' }
        relatedEntityType: { type: string, nullable: true }
        relatedEntityId: { type: integer, nullable: true }
        retryCount: { type: integer, default: 0, description: "Auto-retries up to 3 times before requiring manual intervention (HR-07)." }
        scheduledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time, nullable: true }
        sourceEventId:
          type: integer
          nullable: true
          readOnly: true
          description: The outbox_events row (Kafka message) this row was fanned out from — lets HR trace a queue item back to the originating domain event.
        kafkaTopic: { type: string, nullable: true, readOnly: true, example: "lms.notifications.v1" }
        kafkaPartition: { type: integer, nullable: true, readOnly: true }
        kafkaOffset: { type: integer, nullable: true, readOnly: true, description: "Offset within the partition, for replay/debugging by ops." }

    # ---------- Settings ----------
    SystemSettings:
      type: object
      description: "Maps to HR-08's tabbed sections; send only the section(s) being changed on PATCH."
      properties:
        general:
          type: object
          properties:
            companyName: { type: string }
            companyEmail: { type: string, format: email }
            contactNumber: { type: string }
            logoUrl: { type: string, format: uri, nullable: true }
            dateFormat: { type: string, example: "DD/MM/YYYY" }
            timeFormat: { type: string, example: "24h" }
            timezone: { type: string, example: "Asia/Kolkata" }
            language: { type: string, example: "en" }
        leaveSettings:
          type: object
          properties:
            maxLeaveDays: { type: integer }
            advanceLeaveDays: { type: integer }
            cancellationWindowDays: { type: integer }
            minNoticePeriodDays: { type: integer }
            probationAccessEnabled: { type: boolean }
            carryForwardEnabled: { type: boolean }
        approvalWorkflow:
          type: object
          properties:
            twoStepApprovalEnabled:
              type: boolean
              description: "Whether HR review is required after manager approval, org-wide (per UI/UX §10.2 assumption that this is configurable, not mandatory)."
            autoApproveSmallLeaves: { type: boolean }
            backdatedLeaveRestricted: { type: boolean }
        systemPreferences:
          type: object
          properties:
            employeeSelfRegistration:
              type: boolean
              default: false
              description: "Gates POST /auth/register. Off by default — while off, that endpoint returns 403 with the message \"Contact HR to get enabled.\""
            leaveBalanceDisplayEnabled: { type: boolean }
            weekendSelectionEnabled: { type: boolean }
            holidayDisplayEnabled: { type: boolean }
        notifications:
          type: object
          properties:
            emailProvider: { type: string, example: "SendGrid" }
            smsProvider: { type: string, example: "Twilio", nullable: true }
        security:
          type: object
          properties:
            passwordMinLength: { type: integer, default: 8 }
            ssoGoogleEnabled: { type: boolean }
            ssoMicrosoftEnabled: { type: boolean }
        integrations:
          type: object
          properties:
            calendarSyncProvider: { type: string, nullable: true, example: "Google" }
            ssoProvider: { type: string, nullable: true, example: "Azure AD" }
        systemInfo:
          type: object
          readOnly: true
          properties:
            version: { type: string }
            environment: { type: string }
            databaseVersion: { type: string }
            lastUpdatedBy: { type: string }
            lastUpdatedAt: { type: string, format: date-time }
